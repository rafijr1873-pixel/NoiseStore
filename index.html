<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111613">
  <title>Noise SMP Store</title>
  <meta name="description" content="Noise SMP Store - halaman toko rank server Minecraft.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topline">
    <div class="wrap">
      <span>Official rank store</span>
      <span class="status online">Server Online</span>
    </div>
  </div>

  <header class="site-header">
    <div class="wrap nav">
      <a href="#home" class="brand" aria-label="Noise SMP Store home">
        <span class="brand-mark">N</span>
        <span class="brand-text">
          Noise SMP
          <small>STORE</small>
        </span>
      </a>

      <nav class="nav-links" id="nav-links" aria-label="Menu utama"></nav>

      <button class="cart-button" id="open-cart" type="button" aria-label="Buka keranjang">
        <span>Keranjang</span>
        <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <main id="app"></main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <span>© 2026 Noise SMP Store</span>
      <span>Rank permanen • Minecraft</span>
    </div>
  </footer>

  <dialog id="cart-dialog" aria-labelledby="cart-title">
    <div class="dialog-head">
      <h2 id="cart-title">Keranjangmu</h2>
      <button class="icon-button" id="close-cart" type="button" aria-label="Tutup keranjang">×</button>
    </div>

    <div class="dialog-body">
      <div class="cart-list" id="cart-list"></div>

      <div class="total-row">
        <span>Total</span>
        <strong id="cart-total">Rp0</strong>
      </div>

      <label class="field-label" for="player-name">Gamertag</label>
      <input class="player-input" id="player-name" name="player-name" placeholder="Contoh: NoisePlayer" autocomplete="nickname">

      <button class="checkout-button" id="checkout" type="button" disabled>
        Kirim pesanan ke admin
      </button>

      <p class="fine-print">
        Pesanan akan dibuat sebagai pesan WhatsApp. Pastikan nama akun sudah benar.
      </p>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
